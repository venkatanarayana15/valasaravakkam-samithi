<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samithi Admin</title>
  <link rel="stylesheet" href="/_ui/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <h1>Samithi Admin</h1>
          <p>Content Management</p>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button id="open-site" class="btn btn-ghost">View Site</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <button id="menu-btn" class="btn btn-ghost" aria-label="Toggle menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-right">
          <span id="save-state" class="save-state"></span>
          <button id="save-all" class="btn btn-primary">Save All</button>
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>
  <script src="/_ui/app.js"></script>
</body>
</html>
